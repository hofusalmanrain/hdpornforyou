    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        try {
          var m = localStorage.getItem("hdpornforyou:theme-mode");
          var light =
            m === "light" ||
            (m !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
    <script>
      // Fast-path: hydrate favicon & brand logo instantly from localStorage
      // (populated by previous visit), then refresh from API in the background.
      // This eliminates the "logo pops in a second later" flash.
      (function () {
        try {
          var cachedFav = localStorage.getItem("hdpornforyou:favicon-url");
          if (cachedFav) {
            var link = document.getElementById("app-favicon");
            if (link) link.href = cachedFav;
          }
          var cachedLogo = localStorage.getItem("hdpornforyou:brand-logo-url");
          if (cachedLogo) {
            window.__BRAND_LOGO_URL__ = cachedLogo;
          }
        } catch (e) {}

        function refresh(url, key, apply) {
          fetch(url, { cache: "force-cache" })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var v = d && d.url ? d.url : null;
              try {
                if (v) localStorage.setItem(key, v);
                else localStorage.removeItem(key);
              } catch (e) {}
              apply(v);
            })
            .catch(function () {});
        }

        refresh("/api/favicon", "hdpornforyou:favicon-url", function (v) {
          if (!v) return;
          var link = document.getElementById("app-favicon") || document.createElement("link");
          if (!link.parentNode) { link.rel = "icon"; link.id = "app-favicon"; document.head.appendChild(link); }
          link.href = v;
          var svg = document.getElementById("app-favicon-svg");
          var png = document.getElementById("app-favicon-96");
          if (svg) svg.remove();
          if (png) png.remove();
        });
        refresh("/api/brand-logo", "hdpornforyou:brand-logo-url", function (v) {
          window.__BRAND_LOGO_URL__ = v || undefined;
          window.dispatchEvent(new Event("hdpornforyou:brand-logo-changed"));
        });
      })();
    </script>
